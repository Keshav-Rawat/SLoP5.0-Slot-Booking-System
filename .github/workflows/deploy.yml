name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master, aditya/feature ]
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Lint job — must pass before build runs
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './Slot-Booking-System-Frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          cd Slot-Booking-System-Frontend
          npm ci

      - name: Lint frontend
        run: |
          cd Slot-Booking-System-Frontend
          npm run lint

      - name: Install backend dependencies
        run: |
          cd Slot-Booking-System-Backend
          npm install

      - name: Lint backend
        run: |
          cd Slot-Booking-System-Backend
          npm run lint

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './Slot-Booking-System-Frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd Slot-Booking-System-Frontend
          npm ci

      - name: Build
        run: |
          cd Slot-Booking-System-Frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      # GitHub Pages doesn't support client-side routing natively.
      # 404.html already contains the encode-redirect script (in public/).
      # The dist copy below keeps it in sync with index.html as a belt-and-suspenders fallback.
      - name: Copy index.html to 404.html for SPA routing (belt-and-suspenders)
        run: cp ./Slot-Booking-System-Frontend/dist/index.html ./Slot-Booking-System-Frontend/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Slot-Booking-System-Frontend/dist'

  # Deploy job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4