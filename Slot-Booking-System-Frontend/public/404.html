<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLoP Slot Booking</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — spa-github-pages (encode half)
      // MIT License — https://github.com/rafgraph/spa-github-pages
      //
      // When GitHub Pages 404s on a deep route (e.g. /dashboard), it serves
      // this file. We encode the path into a query-string and redirect to the
      // repo root so index.html / React Router can handle it.
      //
      // pathSegmentsToKeep = 1 for Project Pages (repo lives under a sub-path
      // like /SLoP5.0-Slot-Booking-System/). Set to 0 for User/Org Pages.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- This page is intentionally blank; the script above redirects immediately. -->
  </body>
</html>
