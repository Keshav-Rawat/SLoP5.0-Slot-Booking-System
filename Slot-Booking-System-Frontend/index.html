<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SLoP Slot Booking System</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — spa-github-pages (decode half)
      // MIT License — https://github.com/rafgraph/spa-github-pages
      //
      // 404.html encodes the real path into the query string before redirecting
      // here. This script decodes it and uses history.replaceState so React
      // Router sees the correct path without another page load.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
